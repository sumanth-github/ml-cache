global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  # Add alerting rules if needed later

scrape_configs:
  - job_name: 'ml-cache-cluster'
    static_configs:
      - targets: ['172.29.202.205:2112']  # Your Go cache metrics
    scrape_interval: 5s
    metrics_path: /metrics
    
  - job_name: 'ml-service'
    static_configs:
      - targets: ['172.29.202.205:8000']  # Your Python ML service
    scrape_interval: 10s
    metrics_path: /metrics  # If your ML service has metrics endpoint
